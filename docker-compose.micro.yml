version: '3.8'

services:
  parafa-frontend:
    image: parafa-frontend-prebuild
    container_name: parafa-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.parafa.com.br/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Limites super baixos para servidor pequeno
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 60s  # Menos frequente para economizar recursos
      timeout: 10s
      retries: 2
      start_period: 30s
    networks:
      - parafa-network

networks:
  parafa-network:
    driver: bridge