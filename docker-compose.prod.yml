version: '3.8'

services:
  parafa-frontend:
    build: .
    container_name: parafa-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.parafa.com.br/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Limites de recursos para evitar out of memory
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    # Build args para otimizar
    build:
      context: .
      args:
        - NODE_OPTIONS=--max-old-space-size=1536
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - parafa-network

networks:
  parafa-network:
    driver: bridge