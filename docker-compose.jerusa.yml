services:
  frontend:
    container_name: parafa-frontend-new
    image: parafa-frontend:internal-api-fixed-20261029
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - parafa-internal
    ports:
      - "127.0.0.1:3004:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      API_URL: http://parafa-api/api
      NODE_OPTIONS: --max-old-space-size=128
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/parafa
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  parafa-internal:
    external: true
