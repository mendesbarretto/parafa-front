services:
  frontend:
    container_name: parafa-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-parafa-frontend}:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.parafa.com.br/api
      - NODE_OPTIONS=--max-old-space-size=128
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/parafa
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3