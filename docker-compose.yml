services:
  frontend:
    container_name: parafa-frontend
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-parafa-frontend}:${IMAGE_TAG:-latest}
    networks:
      - cnpj-internal
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      API_URL: ${API_URL:-http://parafa-api/api}
      NODE_OPTIONS: --max-old-space-size=128
    restart: unless-stopped
    volumes:
      - ./logs:/var/log/parafa
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  cnpj-internal:
    external: true
    name: ${INTERNAL_NETWORK:-cnpj-internal}
