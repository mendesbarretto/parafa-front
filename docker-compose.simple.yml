version: '3.8'

services:
  parafa-frontend:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: parafa-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.parafa.com.br/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    # Limites bem baixos para servidor de 2GB
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M  # Para build precisa de mais, depois usa menos
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s  # Mais tempo para build
    networks:
      - parafa-network

networks:
  parafa-network:
    driver: bridge